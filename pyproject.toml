[project]
name = "sheerwater-chat"
version = "0.1.0"
description = "Web chat interface for testing sheerwater-mcp"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Rhiza Research"}
]

dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "httpx",
    "httpx-sse",
    "authlib",
    "itsdangerous",
    "python-multipart",
    "jinja2",
    "anthropic",
    "mcp",
    "databases[aiosqlite]",
]

[project.optional-dependencies]
postgres = [
    "databases[asyncpg]",
]

[project.scripts]
sheerwater-chat = "sheerwater_chat.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sheerwater_chat"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-mock",
    "ruff",
    "pre-commit",
]
